name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # Change this to your default branch if it's different
  workflow_dispatch: # <-- THIS enables the "Run workflow" button in the GitHub Actions UI!

permissions:
  contents: write # Required for pushing build output to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Installs pnpm v9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Deploy
        env:
          # Injects secrets from GitHub Settings -> Secrets and Variables -> Actions
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APIURL: ${{ secrets.APIURL }}
        run: |
          # Configure Git credentials in runner
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pnpm githubBuild
