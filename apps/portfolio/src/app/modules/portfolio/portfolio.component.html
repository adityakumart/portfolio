<div class="portfolio-page-wrapper">
  <button
    mat-icon-button
    class="theme-toggle-btn"
    (click)="toggleTheme()"
    [matTooltip]="isDarkMode() ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
    matTooltipPosition="left"
  >
    <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button
    mat-icon-button
    class="gateway-bolt"
    routerLink="/user"
    matTooltip="Enter Dashboard"
    matTooltipPosition="left"
  >
    <mat-icon>bolt</mat-icon>
  </button>
  
  <div class="header">
    <!-- Immediate / Above-the-fold Critical Path -->
    <app-hero [resume]="resume()" />
    <app-summary [resume]="resume()" />

    <!-- Below-the-fold Viewport Deferred Sections -->
    @defer (on viewport) {
      <app-experience [worksData]="resume().work" />
    } @placeholder {
      <div class="defer-section-placeholder" style="min-height: 200px;"></div>
    }

    @defer (on viewport) {
      <app-education [education]="resume().education" />
    } @placeholder {
      <div class="defer-section-placeholder" style="min-height: 180px;"></div>
    }

    @defer (on viewport) {
      <app-skills [resume]="resume()" [gridColumns]="gridColumns()" />
    } @placeholder {
      <div class="defer-section-placeholder" style="min-height: 180px;"></div>
    }

    @defer (on viewport) {
      <app-certificates [certificates]="resume().certificates" />
    } @placeholder {
      <div class="defer-section-placeholder" style="min-height: 160px;"></div>
    }

    @defer (on viewport) {
      <app-awards [awards]="resume().awards" />
    } @placeholder {
      <div class="defer-section-placeholder" style="min-height: 140px;"></div>
    }
  </div>
</div>
