<section class="py-4 reveal-on-scroll" aria-label="Technical Skills">
  <div class="mb-4">
    <h2 class="text-2xl font-bold tracking-tight text-foreground">Technical Skills</h2>
    <p class="mt-1 max-w-3xl text-sm leading-relaxed text-muted-foreground">
      A curated skillset aligned with modern frontend product delivery,
      interface design, and engineering best practices.
    </p>
  </div>

  <div
    class="grid gap-4.5"
    [style.grid-template-columns]="'repeat(' + gridColumns() + ', 1fr)'"
  >
    @for (skill of resume().skills; track skill.name) {
      <div class="reveal-on-scroll">
        <div hlmCard class="skill-card-with-accent relative min-h-[210px] overflow-hidden rounded-2xl border border-border bg-card p-4 pl-6 shadow-xl transition-all duration-300 hover:-translate-y-1 hover:border-sky-500 hover:bg-secondary">
          <div hlmCardHeader class="p-0">
            <h3 hlmCardTitle class="text-base font-bold text-foreground">{{
              skill.name
            }}</h3>
          </div>
          <div hlmCardContent class="mt-3 p-0">
            <div class="flex flex-wrap items-center gap-2.5">
              @for (keyword of skill.keywords; track keyword) {
                <button
                  type="button"
                  hlmBadge
                  variant="secondary"
                  class="h-9 cursor-pointer rounded-full border border-border px-3.5 text-sm font-medium text-muted-foreground transition-all duration-200 hover:-translate-y-0.5 hover:border-sky-500 hover:bg-sky-500/15 hover:text-foreground active:translate-y-0"
                  [hlmTooltip]="keyword.name"
                  [attr.aria-label]="keyword.name + ' skill'"
                  (click)="openInNewTab(keyword.url)"
                >
                  {{ keyword.name }}
                </button>
              }
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
