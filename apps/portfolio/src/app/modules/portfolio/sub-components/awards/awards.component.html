<section class="py-4 reveal-on-scroll" aria-label="Awards and Recognitions">
  <div class="mb-4">
    <h2 class="text-2xl font-bold tracking-tight text-foreground">Awards & Recognitions</h2>
    <p class="mt-1 text-sm leading-relaxed text-muted-foreground">Key achievements and honors received.</p>
  </div>

  <div class="grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-4.5">
    @for (award of awards(); track award.title) {
      <div class="reveal-on-scroll">
        <div hlmCard class="award-card-with-accent relative min-h-[110px] overflow-hidden rounded-2xl border border-border bg-card p-4 pl-6 shadow-xl transition-all duration-300 hover:-translate-y-1 hover:border-sky-500 hover:bg-secondary">
          <div hlmCardHeader class="p-0">
            <h3 hlmCardTitle class="text-base font-bold text-foreground">{{
              award.title
            }}</h3>
            <div
              class="mt-1.5 flex items-center justify-between gap-2 text-xs"
            >
              <span class="font-medium text-sky-500">{{ award.awarder }}</span>
              <span class="text-muted-foreground">{{ award.date }}</span>
            </div>
          </div>
          <div hlmCardContent class="mt-3 p-0">
            <p class="text-sm leading-relaxed text-muted-foreground">{{ award.summary }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</section>
