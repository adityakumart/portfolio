<div class="mt-4">
  <h4 class="mb-3 text-xs font-semibold tracking-wider uppercase text-muted-foreground">Key Projects</h4>
  <hlm-accordion type="multiple" class="border-none gap-2.5 bg-transparent">
    @for (project of projects(); track $index) {
      <hlm-accordion-item
        [isOpened]="$first"
        class="overflow-hidden rounded-xl border border-border/80 bg-secondary/60 hover:bg-secondary/90 transition-all duration-200 shadow-xs"
      >
        <hlm-accordion-trigger class="px-4 py-3 hover:no-underline font-normal">
          <div class="flex flex-1 flex-wrap items-center justify-between gap-2 pr-3">
            <span class="text-sm font-bold text-foreground text-left">{{ project.name }}</span>
            <span hlmBadge variant="outline" class="border-border/60 bg-background/60 text-[11px] font-normal text-muted-foreground">
              {{ project.startDate }} - {{ project.endDate }}
            </span>
          </div>
        </hlm-accordion-trigger>

        <hlm-accordion-content class="px-4 pb-4 pt-1">
          <p class="text-xs leading-relaxed text-muted-foreground mb-3">
            {{ project.description }}
          </p>

          <div class="flex flex-wrap gap-1.5" role="list" aria-label="Project Skills">
            @for (skill of project.skills; track $index) {
              <span hlmBadge variant="secondary" class="rounded-md border border-border/40 px-2 py-0.5 text-[11px] font-medium text-foreground">
                {{ skill }}
              </span>
            }
          </div>
        </hlm-accordion-content>
      </hlm-accordion-item>
    }
  </hlm-accordion>
</div>
