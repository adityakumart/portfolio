<section class="py-4 reveal-on-scroll" aria-label="Certificates">
  <div class="mb-4">
    <h2 class="text-2xl font-bold tracking-tight text-foreground">Certificates</h2>
    <p class="mt-1 text-sm leading-relaxed text-muted-foreground">
      Professional certifications and completed courses.
    </p>
  </div>

  <div class="grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-4.5">
    @for (cert of certificates(); track cert.name) {
      <div class="reveal-on-scroll">
        <div
          hlmCard
          class="certificate-card-with-accent relative min-h-[110px] overflow-hidden rounded-2xl border border-border bg-card p-4 pl-6 shadow-xl transition-all duration-300 hover:-translate-y-1 hover:border-sky-500 hover:bg-secondary"
        >
          <div hlmCardHeader class="p-0">
            <h3 hlmCardTitle class="text-base font-bold">
              <a
                [href]="cert.url"
                target="_blank"
                rel="noopener noreferrer"
                [attr.aria-label]="cert.name + ' Certificate'"
                class="text-foreground transition-colors duration-200 hover:text-primary"
              >{{ cert.name }}</a>
            </h3>
            <div
              class="mt-1.5 flex items-center justify-between gap-2 text-xs"
            >
              <span class="font-medium capitalize text-sky-500">{{ cert.issuer }}</span>
              <span class="text-muted-foreground">{{ cert.date }}</span>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
