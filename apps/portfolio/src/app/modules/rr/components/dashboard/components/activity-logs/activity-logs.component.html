<h2>System Activity Logs</h2>

<div class="log-filter-bar">
  <mat-form-field appearance="outline" style="width:180px; margin-bottom: 0;">
    <mat-label>From Date</mat-label>
    <input matInput type="date" [(ngModel)]="logFilterFrom" />
  </mat-form-field>
  
  <mat-form-field appearance="outline" style="width:180px; margin-bottom: 0;">
    <mat-label>To Date</mat-label>
    <input matInput type="date" [(ngModel)]="logFilterTo" />
  </mat-form-field>

  <button class="action-btn success" (click)="loadActivityLogs()">
    <ng-icon style="font-size: 16px; width: 16px; height: 16px; vertical-align: middle;" name="lucideSearch"></ng-icon>
    <span>Get Logs</span>
  </button>
  <button class="action-btn" (click)="clearLogFilters()">
    <ng-icon style="font-size: 16px; width: 16px; height: 16px; vertical-align: middle;" name="lucideEraser"></ng-icon>
    <span>Clear Filters & Display All</span>
  </button>
</div>

<div class="logs-scroll">
  @for (log of logs(); track log._id) {
    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <span style="color: var(--color-cyan-500); font-weight: 700;">[{{ log.time }}]</span>
      <span class="badge" [class]="log.role === 'admin' ? 'status-active' : 'status-available'" style="padding: 2px 8px; font-size: 10px;">{{ log.role | uppercase }}</span>
      <span style="font-weight: 700; color: var(--foreground);">{{ log.performedBy }}</span>
      <span style="color: var(--muted-foreground);">—</span>
      <span style="color: var(--foreground); font-weight: 550;">{{ log.action }}</span>
    </div>
  } @empty {
    <div style="text-align: center; color: var(--muted-foreground); padding: 24px 0;">
      <ng-icon style="font-size: 32px; width: 32px; height: 32px; display: block; margin: 0 auto 8px auto;" name="lucideAlertCircle"></ng-icon>
      <p style="margin: 0;">No activity logs found matching the criteria.</p>
    </div>
  }
</div>
