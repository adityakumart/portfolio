<div class="dashboard-wrapper">
  <!-- Header -->
  <header class="app-header">
    <div class="header-brand" routerLink="/user/rr/home">
      <ng-icon class="brand-icon" name="lucideCar"></ng-icon>
      <h2 class="app-title">RoadReady</h2>
    </div>

    <div class="relative">
      <button
        hlmBtn
        variant="ghost"
        [hlmDropdownMenuTrigger]="profileMenu"
        class="flex items-center gap-3 px-3 py-1.5 h-auto rounded-xl border border-border bg-card/60 hover:bg-muted/50 transition-all"
      >
        <hlm-avatar class="h-8 w-8">
          <span
            hlmAvatarFallback
            class="bg-gradient-to-tr from-cyan-500 to-blue-600 text-white font-bold text-xs shadow-sm"
          >
            {{ getInitials() }}
          </span>
        </hlm-avatar>
        <div class="flex flex-col text-left">
          <span class="font-bold text-xs leading-tight text-foreground"
            >{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</span
          >
          <span
            class="text-[10px] font-extrabold text-cyan-500 tracking-wider uppercase"
            >{{ currentUser()?.role }}</span
          >
        </div>
        <ng-icon
          class="text-muted-foreground text-sm"
          name="lucideChevronDown"
        ></ng-icon>
      </button>

      <ng-template #profileMenu>
        <div
          hlmDropdownMenu
          class="w-56 p-1 rounded-xl shadow-xl border border-border bg-card/95 backdrop-blur-md"
        >
          <button
            hlmDropdownMenuItem
            class="flex items-center gap-2 px-3 py-2 text-xs font-semibold cursor-pointer rounded-lg hover:bg-muted w-full text-left"
            (click)="showProfilePopup()"
          >
            <ng-icon name="lucideUser" class="text-muted-foreground"></ng-icon>
            <span>View Profile</span>
          </button>
          @if (isAdmin()) {
            <button
              hlmDropdownMenuItem
              class="flex items-center gap-2 px-3 py-2 text-xs font-semibold cursor-pointer rounded-lg hover:bg-muted w-full text-left"
              [routerLink]="['/user/rr/activity-logs']"
            >
              <ng-icon
                name="lucideHistory"
                class="text-muted-foreground"
              ></ng-icon>
              <span>Activity Logs</span>
            </button>
          }
          <div
            hlmDropdownMenuSeparator
            class="my-1 border-t border-border"
          ></div>
          <button
            hlmDropdownMenuItem
            class="flex items-center gap-2 px-3 py-2 text-xs font-semibold cursor-pointer rounded-lg text-destructive hover:bg-destructive/10 w-full text-left"
            (click)="logout()"
          >
            <ng-icon name="lucideLogOut" class="text-destructive"></ng-icon>
            <span>Logout</span>
          </button>
        </div>
      </ng-template>
    </div>
  </header>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar" [class.collapsed]="isSidebarCollapsed()">
      <div class="sidebar-toggle-bar">
        <button
          type="button"
          class="sidebar-toggle-btn"
          (click)="toggleSidebar()"
          [hlmTooltip]="
            isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'
          "
          tooltipPosition="right"
          [attr.aria-label]="
            isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'
          "
        >
          <ng-icon
            [name]="
              isSidebarCollapsed() ? 'lucideChevronRight' : 'lucideChevronLeft'
            "
          ></ng-icon>
        </button>
      </div>

      <div class="sidebar-scroll">
        <!-- Section: General -->
        <div class="menu-section">
          <ul class="menu">
            <li
              class="menu-item"
              [routerLink]="['/user/rr/dashboard']"
              routerLinkActive="active-menu"
              [routerLinkActiveOptions]="{ exact: true }"
              [hlmTooltip]="'Overview'"
              [tooltipDisabled]="!isSidebarCollapsed()"
              tooltipPosition="right"
            >
              <div class="menu-item-pill"></div>
              <div class="menu-item-content">
                <ng-icon name="lucideLayoutDashboard"></ng-icon>
                <span>Overview</span>
              </div>
            </li>
            <li
              class="menu-item"
              [routerLink]="['/user/rr/booking/list']"
              routerLinkActive="active-menu"
              [hlmTooltip]="'Active Rentals'"
              [tooltipDisabled]="!isSidebarCollapsed()"
              tooltipPosition="right"
            >
              <div class="menu-item-pill"></div>
              <div class="menu-item-content">
                <ng-icon name="lucideCalendarDays"></ng-icon>
                <span>Active Rentals</span>
              </div>
            </li>
            <li
              class="menu-item"
              [routerLink]="['/user/rr/vehicle/list']"
              routerLinkActive="active-menu"
              [hlmTooltip]="'Vehicles Inventory'"
              [tooltipDisabled]="!isSidebarCollapsed()"
              tooltipPosition="right"
            >
              <div class="menu-item-pill"></div>
              <div class="menu-item-content">
                <ng-icon name="lucideCar"></ng-icon>
                <span>Vehicles Inventory</span>
              </div>
            </li>

            <!-- Section: Administrative (Admin Only) -->
            @if (isAdmin()) {
              <li
                class="menu-item"
                [routerLink]="['/user/rr/employee/list']"
                routerLinkActive="active-menu"
                [hlmTooltip]="'Staff Registry'"
                [tooltipDisabled]="!isSidebarCollapsed()"
                tooltipPosition="right"
              >
                <div class="menu-item-pill"></div>
                <div class="menu-item-content">
                  <ng-icon name="lucideBadgeCheck"></ng-icon>
                  <span>Staff Registry</span>
                </div>
              </li>
            }

            <li
              class="menu-item"
              [routerLink]="['/user/rr/history']"
              routerLinkActive="active-menu"
              [hlmTooltip]="'Historical Logs'"
              [tooltipDisabled]="!isSidebarCollapsed()"
              tooltipPosition="right"
            >
              <div class="menu-item-pill"></div>
              <div class="menu-item-content">
                <ng-icon name="lucideHistory"></ng-icon>
                <span>Historical Logs</span>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </aside>

    <!-- Main Content Outlet -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- POPUP: VIEW PROFILE POPUP -->
  <ng-template #profileInfoDialog>
    <div class="flex flex-col h-full max-h-[calc(85vh-3rem)] overflow-hidden">
      <!-- Fixed Header -->
      <div class="shrink-0 flex items-center justify-between pb-3 border-b">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <ng-icon name="lucideUser" class="text-primary"></ng-icon>
          <span>Desk Agent Profile</span>
        </h3>
        <button
          hlmBtn
          size="icon"
          variant="ghost"
          class="h-8 w-8 text-muted-foreground hover:text-foreground"
          (click)="closeProfilePopup()"
          aria-label="Close dialog"
        >
          <ng-icon name="lucideX"></ng-icon>
        </button>
      </div>

      <!-- Scrollable Body -->
      <div class="flex-1 min-h-0 overflow-y-auto py-3 pr-1 space-y-3">
        <div>
          <label class="text-xs text-muted-foreground block mb-1"
            >Agent Identifier</label
          >
          <input
            hlmInput
            type="text"
            [value]="currentUser()?.id"
            readonly
            disabled
            class="w-full text-sm"
          />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block mb-1"
            >Full Legal Name</label
          >
          <input
            hlmInput
            type="text"
            [value]="currentUser()?.firstName + ' ' + currentUser()?.lastName"
            readonly
            disabled
            class="w-full text-sm"
          />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block mb-1"
            >Registered Email Address</label
          >
          <input
            hlmInput
            type="text"
            [value]="currentUser()?.email"
            readonly
            disabled
            class="w-full text-sm"
          />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block mb-1"
            >Authorized System Role</label
          >
          <input
            hlmInput
            type="text"
            [value]="currentUser()?.role | uppercase"
            readonly
            disabled
            class="w-full text-sm"
          />
        </div>
      </div>

      <!-- Fixed Footer -->
      <div class="shrink-0 flex justify-end pt-3 border-t">
        <button
          hlmBtn
          variant="outline"
          size="sm"
          (click)="closeProfilePopup()"
        >
          Dismiss
        </button>
      </div>
    </div>
  </ng-template>
</div>
