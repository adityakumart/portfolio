<div class="dialog-overlay-backdrop" (click)="close()">
  <div class="dialog-modal-card" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <div>
        <h2 class="modal-title">
          {{ state.editingMeal() ? 'Edit' : 'Log' }} {{ mealTypeTitle }}
        </h2>
        <p class="modal-subtitle">Record your food intake and track nutrients.</p>
      </div>
      <button hlmBtn variant="ghost" size="icon" (click)="close()" class="close-btn">
        <ng-icon name="lucideX"></ng-icon>
      </button>
    </div>

    <!-- Form Content -->
    <form (ngSubmit)="onSubmit()" class="modal-form-content">
      <!-- Food Name -->
      <div class="form-group">
        <label hlmLabel for="foodName">Food / Dish Name *</label>
        <input
          hlmInput
          id="foodName"
          name="foodName"
          [ngModel]="foodName()"
          (ngModelChange)="foodName.set($event)"
          placeholder="e.g. Greek Yogurt with Walnuts & Honey"
          required
        />
      </div>

      <!-- Portion & Calories Row -->
      <div class="form-row-2">
        <div class="form-group">
          <label hlmLabel for="portionSize">Portion / Quantity</label>
          <input
            hlmInput
            id="portionSize"
            name="portionSize"
            [ngModel]="portionSize()"
            (ngModelChange)="portionSize.set($event)"
            placeholder="e.g. 1 bowl (200g)"
          />
        </div>

        <div class="form-group">
          <label hlmLabel for="estimatedCalories">Estimated Calories (kcal)</label>
          <input
            hlmInput
            id="estimatedCalories"
            type="number"
            name="estimatedCalories"
            [ngModel]="estimatedCalories()"
            (ngModelChange)="estimatedCalories.set($event)"
            placeholder="e.g. 320"
            min="0"
          />
        </div>
      </div>

      <!-- Meal Time & Notes -->
      <div class="form-row-2">
        <div class="form-group">
          <label hlmLabel for="mealTime">Meal Time</label>
          <input
            hlmInput
            id="mealTime"
            type="time"
            name="mealTime"
            [ngModel]="mealTime()"
            (ngModelChange)="mealTime.set($event)"
          />
        </div>

        <div class="form-group">
          <label hlmLabel for="notes">Notes / Ingredients</label>
          <input
            hlmInput
            id="notes"
            name="notes"
            [ngModel]="notes()"
            (ngModelChange)="notes.set($event)"
            placeholder="e.g. Low sugar, home cooked"
          />
        </div>
      </div>

      <!-- Food Photo Upload Section -->
      <div class="form-group photo-upload-section">
        <label hlmLabel>Meal Photo</label>

        @if (imageUrl()) {
          <div class="photo-preview-container">
            <img [src]="imageUrl()" alt="Meal photo preview" class="preview-img" />
            <button
              type="button"
              hlmBtn
              variant="destructive"
              size="icon"
              (click)="removePhoto()"
              class="remove-photo-btn"
              title="Remove Photo"
            >
              <ng-icon name="lucideTrash2"></ng-icon>
            </button>
          </div>
        } @else {
          <label class="dropzone-label">
            <input
              type="file"
              accept="image/*"
              (change)="onFileSelected($event)"
              class="hidden-file-input"
              [disabled]="isUploadingPhoto()"
            />
            <div class="dropzone-inner">
              @if (isUploadingPhoto()) {
                <ng-icon name="lucideLoader2" class="spin-icon text-2xl text-blue-500"></ng-icon>
                <span>Compressing & uploading to cloud...</span>
              } @else {
                <ng-icon name="lucideCamera" class="upload-camera-icon"></ng-icon>
                <span class="upload-title">Click to upload a photo of your meal</span>
                <span class="upload-caption">Auto-compressed & stored directly in S3 cloud</span>
              }
            </div>
          </label>
        }

        @if (uploadError()) {
          <p class="error-msg">{{ uploadError() }}</p>
        }
      </div>

      <!-- Footer Buttons -->
      <div class="modal-footer">
        <button type="button" hlmBtn variant="outline" (click)="close()">
          Cancel
        </button>
        <button
          type="submit"
          hlmBtn
          variant="default"
          [disabled]="!foodName().trim() || state.isSaving() || isUploadingPhoto()"
          class="save-btn"
        >
          @if (state.isSaving()) {
            Saving...
          } @else {
            <ng-icon name="lucideCheck" class="mr-1"></ng-icon>
            {{ state.editingMeal() ? 'Update Item' : 'Save Item' }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
