<div class="min-h-[80vh] flex items-center justify-center p-4 sm:p-6 lg:p-8 animate-in fade-in duration-300">
  <div class="max-w-md w-full space-y-6">
    <section
      hlmCard
      class="border border-border/80 bg-card/95 backdrop-blur-xl shadow-2xl rounded-3xl p-6 sm:p-8 text-center space-y-6 relative overflow-hidden"
    >
      <!-- Background subtle glow -->
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Icon header -->
      <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl bg-amber-500/10 text-amber-500 border border-amber-500/20 shadow-inner">
        <ng-icon name="lucideShieldAlert" class="text-4xl"></ng-icon>
      </div>

      <!-- Title & description -->
      <div class="space-y-2">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-500 border border-amber-500/20 mb-1">
          <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span>Access Restricted</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">
          No Modules Assigned
        </h1>
        <p class="text-sm text-muted-foreground leading-relaxed">
          Your account is registered and authenticated, but no feature modules are currently provisioned for your workspace.
        </p>
      </div>

      <!-- User identifier pill -->
      @if (currentUser()) {
        <div class="px-4 py-2.5 rounded-2xl bg-muted/60 border border-border/50 text-xs font-mono text-muted-foreground break-all">
          {{ currentUser()?.email }}
        </div>
      }

      <!-- Modules explanation list -->
      <div class="text-left text-xs space-y-2.5 bg-background/50 rounded-2xl p-4 border border-border/60">
        <div class="text-muted-foreground font-medium flex items-center gap-2 text-foreground">
          <ng-icon name="lucideSparkles" class="text-amber-500 text-sm"></ng-icon>
          <span>Available Modules</span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1 text-[11px] text-muted-foreground">
          <div class="flex items-center gap-1.5">
            <span class="h-1.5 w-1.5 rounded-full bg-muted-foreground/40"></span>
            <span>AI Space</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="h-1.5 w-1.5 rounded-full bg-muted-foreground/40"></span>
            <span>AI Assistant</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="h-1.5 w-1.5 rounded-full bg-muted-foreground/40"></span>
            <span>File Manager</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="h-1.5 w-1.5 rounded-full bg-muted-foreground/40"></span>
            <span>Diet & Hydration</span>
          </div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="space-y-3 pt-2">
        <button
          hlmBtn
          class="w-full flex items-center justify-center gap-2 h-11 rounded-xl font-semibold shadow-md"
          [disabled]="isRefreshing()"
          (click)="refreshPermissions()"
        >
          @if (isRefreshing()) {
            <hlm-spinner class="h-4 w-4" />
            <span>Checking Permissions...</span>
          } @else {
            <ng-icon name="lucideRefreshCw" class="text-base"></ng-icon>
            <span>Refresh Permissions</span>
          }
        </button>

        <div class="flex items-center gap-3">
          <button
            hlmBtn
            variant="outline"
            class="flex-1 flex items-center justify-center gap-2 h-10 rounded-xl text-xs font-semibold"
            routerLink="/"
          >
            <ng-icon name="lucideHome"></ng-icon>
            <span>Home</span>
          </button>
          <button
            hlmBtn
            variant="ghost"
            class="flex-1 flex items-center justify-center gap-2 h-10 rounded-xl text-xs font-semibold text-destructive hover:bg-destructive/10"
            (click)="logout()"
          >
            <ng-icon name="lucideLogOut"></ng-icon>
            <span>Log Out</span>
          </button>
        </div>
      </div>
    </section>
  </div>
</div>
