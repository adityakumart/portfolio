<div class="profile-container">
  @if (currentUser()) {
  <div class="glass-card profile-card">
    <div class="profile-header">
      <h2 class="title">AI Assistant</h2>
      <p class="subtitle">
        Ask questions, format code, and get help from your personal assistant.
      </p>
    </div>

    <div class="action-buttons">
      <button
        hlmBtn
        class="ai-btn flex items-center justify-center gap-2 w-full"
        routerLink="/user/ai"
      >
        <ng-icon name="lucideMessageSquare"></ng-icon> Chat with Assistant
      </button>
    </div>
  </div>

  <div class="glass-card profile-card">
    <div class="profile-header">
      <h2 class="title">AI Space</h2>
      <p class="subtitle">
        Engage in real-time streaming conversations with full context tracking.
      </p>
    </div>

    <div class="action-buttons">
      <button
        hlmBtn
        class="ai-btn bg-gradient-to-r from-violet-500 to-orange-400 text-white flex items-center justify-center gap-2 w-full"
        routerLink="/user/chat"
      >
        <ng-icon name="lucideZap"></ng-icon> Open AI Chat
      </button>
    </div>
  </div>

  <div class="glass-card profile-card">
    <div class="profile-header">
      <h2 class="title files-title">File Vault</h2>
      <p class="subtitle">
        Upload, download, organize, and view your project storage securely.
      </p>
    </div>

    <div class="action-buttons">
      <button
        hlmBtn
        class="files-btn flex items-center justify-center gap-2 w-full"
        routerLink="/user/files"
      >
        <ng-icon name="lucideFolderArchive"></ng-icon> Open File Vault
      </button>
    </div>
  </div>
  } @else {
  <div class="glass-card loading-card">
    <div class="spinner-container">
      <div class="loading-ring"></div>
    </div>
    <p class="loading-text">Loading...</p>
  </div>
  }
</div>
